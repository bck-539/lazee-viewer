[package]
name = "lazee-core"
description = "Library indexing, metadata and thumbnails for Lazee Viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
log.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
kamadak-exif = "0.6"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
blake3 = "1"
rayon = "1"
walkdir = "2"
crossbeam-channel = "0.5"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# ONNX Runtime is loaded at run time from a DLL shipped next to the app, so
# builds need no native ONNX Runtime and the DLL can be swapped (CPU or
# DirectML) without rebuilding.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-20"] }
quick-xml = "0.38"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_WNet",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"
