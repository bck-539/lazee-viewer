[package]
name = "lazee-viewer"
description = "Lightweight photo viewer with face recognition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lazee-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
notify = "8"
serde.workspace = true
serde_json = "1"
log.workspace = true
env_logger = "0.11"
