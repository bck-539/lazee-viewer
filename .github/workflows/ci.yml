name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p lazee-viewer
      # A self-contained exe to try out: the MSVC build links the WebView2
      # loader statically, so no DLL has to sit next to it.
      - uses: actions/upload-artifact@v4
        with:
          name: lazee-viewer-windows-x64
          path: target/release/lazee-viewer.exe
          if-no-files-found: error
